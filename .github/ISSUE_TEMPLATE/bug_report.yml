name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Never paste your Shodan API key. The **Test the connection** button of the configuration often tells where it stops: paste its message below.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.3.0'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → Shodan, or Settings → Supervision.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Result of "Test the connection" and "Diagnostic"
      description: The message of the "Test the connection" button, and the "Shodan diagnostic" lines written to the logs of the integration by the "Diagnostic" button (never the key in them). Say what https://www.shodan.io/host/<address> shows for the same address.
      render: text
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs of the integration (Settings → Supervision). In developer mode, add the environment variable `DEBUG=gladys-integration-sdk` for the SDK debug logs, reproduce, then copy the lines. The logs never contain the API key.
      render: text
